services:
  acevo-server:
    image: zino1337/acevo-server:latest
    build:
      context: .
    container_name: acevo-server
    restart: no
    init: true
    stop_grace_period: 90s
    entrypoint:
      - /bin/bash
      - -lc
      - |
        chmod +x /opt/acevo/scripts/*.sh 2>/dev/null || true
        exec /opt/acevo/scripts/start.sh
    volumes:
      - ./scripts:/opt/acevo/scripts
      - ./volumes/data:/data
      - ./volumes/steam:/root/.local/share/Steam
    env_file:
      - .env
    ports:
      - "${SERVER_TCP_PORT:-9700}:${SERVER_TCP_PORT:-9700}/tcp"
      - "${SERVER_UDP_PORT:-9700}:${SERVER_UDP_PORT:-9700}/udp"
      - "${SERVER_HTTP_PORT:-8080}:${SERVER_HTTP_PORT:-8080}/tcp"
      - "${DASHBOARD_PORT:-8090}:${DASHBOARD_PORT:-8090}/tcp" # web dashboard
